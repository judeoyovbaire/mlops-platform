# Kind cluster for the e2e job (.github/workflows/ci-cd.yaml, e2e-test).
# Argo's quick-start-minimal brings its own MinIO and artifact-repositories
# ConfigMap; nothing is exposed on the host, the tests go through kubectl and
# the argo CLI against the API server.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mlops-e2e-test
nodes:
  - role: control-plane
  - role: worker

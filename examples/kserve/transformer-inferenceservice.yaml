# InferenceService with Transformer + Predictor pattern.
# The transformer applies preprocessing (feature scaling, encoding) before
# forwarding to the sklearn predictor, decoupling preprocessing from the model.
# KServe injects --model_name and --predictor_host into the transformer but
# not the predictor protocol, which defaults to v1. That matches this sklearn
# predictor; in front of a v2 predictor (MLServer), add
#   args: ["--predictor_protocol=v2"]
# to the transformer container. v2 requests may carry spec-style flat data
# with a shape or nested rows; the forwarded tensor's shape and datatype
# describe the transformed features.
#
# Note the CI-deployed champion (champion-inferenceservice.template.yaml) is
# the bundled pyfunc from build_serving_model.py: it already preprocesses raw
# features, so this transformer in front of it would scale twice. Pair the
# transformer with the bare model artifact (train-model's model.joblib), or
# set PASSTHROUGH_MODE=true to exercise the plumbing only.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: sklearn-iris-with-transformer
  namespace: mlops
  labels:
    mlops.io/model-name: iris-classifier
    mlops.io/model-version: "1.0.0"
    mlops.io/model-owner: platform-team
    mlops.io/model-stage: staging
  annotations:
    mlops.io/mlflow-experiment-id: "1"
    mlops.io/mlflow-run-id: "placeholder"
spec:
  transformer:
    containers:
      - name: transformer
        # Pinned Git-SHA tag from build-sign-publish. Mutable tags are
        # rejected at admission (governance/immutable-image-tags-policy.yaml).
        image: ghcr.io/judeoyovbaire/mlops-platform/kserve-transformer:5bf53d3
        env:
          - name: PREPROCESSOR_PATH
            value: /mnt/models/preprocessor.joblib
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
  predictor:
    model:
      modelFormat:
        name: sklearn
      storageUri: gs://mlops-models/iris-classifier/v1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1
          memory: 1Gi

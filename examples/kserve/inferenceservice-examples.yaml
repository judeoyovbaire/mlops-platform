# KServe InferenceService Examples - MANUAL DEMOS ONLY.
# These use public pre-trained models to validate KServe functionality.
# CI deploys the real thing: the registry champion, rendered from
# champion-inferenceservice.template.yaml by the deploy workflow.

# Basic sklearn model deployment - manual demo configuration
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: sklearn-iris
  namespace: mlops
  labels:
    app.kubernetes.io/name: sklearn-iris
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: mlops-platform
    app.kubernetes.io/managed-by: kserve
    # Required by governance/model-registry-policies.yaml (Kyverno Enforce)
    mlops.io/model-name: sklearn-iris-demo
    mlops.io/model-version: "1.0.0"
    mlops.io/model-owner: platform-team
    mlops.io/model-stage: staging
  annotations:
    # A public KServe sample model, not an MLflow run: the lineage policy
    # requires these keys.
    mlops.io/mlflow-run-id: "external-pretrained"
    mlops.io/mlflow-experiment-id: "external-pretrained"
spec:
  predictor:
    serviceAccountName: kserve-inference
    minReplicas: 1
    maxReplicas: 3
    containerConcurrency: 10
    model:
      modelFormat:
        name: sklearn
      storageUri: gs://kfserving-examples/models/sklearn/1.0/model
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    # Pod anti-affinity for high availability
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: sklearn-iris
              topologyKey: kubernetes.io/hostname
---
# ServiceAccount for KServe inference workloads
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kserve-inference
  namespace: mlops
  labels:
    app.kubernetes.io/name: kserve-inference
    app.kubernetes.io/component: serviceaccount
    app.kubernetes.io/part-of: mlops-platform
---
# PodDisruptionBudget for sklearn-iris
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sklearn-iris-pdb
  namespace: mlops
  labels:
    app.kubernetes.io/name: sklearn-iris
    app.kubernetes.io/component: pdb
    app.kubernetes.io/part-of: mlops-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      serving.kserve.io/inferenceservice: sklearn-iris
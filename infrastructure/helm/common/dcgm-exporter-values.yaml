# NVIDIA DCGM Exporter Helm values
# DaemonSet runs on GPU nodes and exports metrics for Prometheus scraping

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: nvidia.com/gpu.present
              operator: In
              values:
                - "true"

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 15s
  # Chart 4.x defaults scrapeTimeout to 25s; a timeout above the interval
  # makes Prometheus Operator drop the whole ServiceMonitor silently.
  scrapeTimeout: 10s
  additionalLabels:
    release: prometheus

# No `arguments`: chart 4.x mounts its counters ConfigMap at
# /etc/dcgm-exporter/default-counters.csv, the exporter's default path. The
# old `-f dcp-metrics-included.csv` read the file baked into the image instead.

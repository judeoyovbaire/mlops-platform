# Grafana Alloy Helm Values - Unified Telemetry Collector
# Chart: grafana/alloy
# Replaces Promtail as the recommended log shipping agent for Loki
# Alloy uses River configuration language for pipeline definitions

alloy:
  configMap:
    content: |
      // Kubernetes log discovery, limited to the pods on this node. Alloy
      // runs as a DaemonSet; without the selector every replica tails every
      // pod in the cluster and each log line reaches Loki once per node
      // (JDH-418). HOSTNAME is the node name (the chart sets it from
      // spec.nodeName).
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      // Relabel to add namespace, pod, container labels
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "argo|mlflow|kserve|monitoring|argocd|mlops"
          action        = "keep"
        }
      }

      // Collect logs from discovered pods
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.pipeline.receiver]
      }

      // Processing pipeline - add static labels
      loki.process "pipeline" {
        stage.static_labels {
          values = {
            platform = "mlops",
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      // Ship logs to Loki
      loki.write "default" {
        endpoint {
          url       = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
          tenant_id = "mlops"
        }
      }

  # Container settings live under `alloy.`; at the top level the chart
  # ignores them (JDH-418: the previous file set securityContext, resources
  # and tolerations top-level, so Alloy ran with none of them).
  #
  # loki.source.kubernetes reads logs through the Kubernetes API, not from
  # /var/log on the host, so the container has no reason to run as root.
  # The image defines an `alloy` user, uid and gid 473, but does not switch
  # to it (its Dockerfile calls non-root an experimental mode); the chart's
  # own config-reloader sidecar runs non-root, and nothing the chart mounts
  # needs root. --storage.path=/tmp/alloy lives in the writable layer.
  securityContext:
    runAsNonRoot: true
    runAsUser: 473
    runAsGroup: 473
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

controller:
  type: daemonset
  # Pod settings live under `controller.`. Tolerate every taint so the
  # DaemonSet also lands on the GPU and training nodes.
  tolerations:
    - effect: NoSchedule
      operator: Exists

serviceMonitor:
  enabled: true
  additionalLabels:
    release: prometheus

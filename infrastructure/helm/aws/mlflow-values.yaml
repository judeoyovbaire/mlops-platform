# MLflow Helm Chart Values for AWS EKS (chart version 1.11.7, MLflow 3.16.0)
# Uses RDS PostgreSQL and S3 for artifacts
#
# Reachability: cluster-internal only. There is deliberately no Ingress - the
# previous internet-facing ALB fronted an unauthenticated MLflow 3.7.0 that sat
# inside CVE-2026-64849 (unauthenticated SSRF, CISA KEV). Operators use
# `make port-forward-mlflow`; CI uses kubectl port-forward (reusable-deploy-model).

replicaCount: 1

# Use chart's default image (burakince/mlflow) which includes psycopg2 for PostgreSQL
# The official ghcr.io/mlflow/mlflow image does NOT include database drivers
image:
  repository: burakince/mlflow
  # Pin explicitly (chart default follows appVersion). 3.16.0 is the newest
  # burakince tag on Docker Hub; >= 3.15.0 fixes CVE-2026-64849, >= 3.10 the
  # registry path-traversal fixes.
  tag: "3.16.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: false
  name: "mlflow"

service:
  type: ClusterIP
  port: 5000

backendStore:
  databaseMigration: true
  postgres:
    enabled: true
    host: "${db_host}"
    port: 5432
    database: "${db_name}"
    user: "mlflow"
  # Use existing K8s secret for database credentials
  existingDatabaseSecret:
    name: "mlflow-postgres"
    usernameKey: "username"
    passwordKey: "password"

artifactRoot:
  s3:
    enabled: true
    bucket: "${s3_bucket}"
    awsAccessKeyId: ""
    awsSecretAccessKey: ""

# Environment variables for AWS SDK (chart 1.8.1 expects object, not array)
extraEnvVars:
  AWS_DEFAULT_REGION: "${aws_region}"
  # SSL mode for RDS PostgreSQL - require encrypted connections
  PGSSLMODE: "require"

# MLflow 3.x host validation: allow in-cluster service names and localhost
# Setting log.enabled=false prevents chart from adding --gunicorn-opts,
# which allows uvicorn (default) to be used with security middleware flags
extraArgs:
  host: "0.0.0.0"
  # MLflow's host validation matches EXACTLY, port included, and only
  # /health is exempt - verified empirically: Host "localhost:5001" -> 403,
  # bare "localhost" -> passes. In-cluster clients use :5000 URIs, so every
  # entry needs both ported and portless forms or NO API client can connect.
  allowed-hosts: "mlflow.mlflow.svc.cluster.local:5000,mlflow.mlflow.svc:5000,mlflow.mlflow:5000,localhost:5000,127.0.0.1:5000,mlflow.mlflow.svc.cluster.local,mlflow.mlflow.svc,mlflow.mlflow,localhost,127.0.0.1"
  workers: "2"

# Disable chart's gunicorn logging (uses --gunicorn-opts which breaks security middleware)
# MLflow 3.x uses uvicorn by default which supports --allowed-hosts
log:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Pod security (match chart defaults: user 1001)
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1001
  fsGroupChangePolicy: "OnRootMismatch"

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  capabilities:
    drop:
      - ALL

# Probes (chart handles httpGet internally, just set timing)
livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# No Ingress: see the header comment. If an external endpoint is ever needed
# again it must be internal-scheme and sit behind authentication (auth.* in
# this chart, or the oauth2Proxy sidecar), never a bare internet-facing ALB.
ingress:
  enabled: false

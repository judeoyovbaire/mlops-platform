# Argo Workflows values for ML pipeline orchestration
# Lightweight configuration without database persistence

# Controller configuration
controller:
  replicas: 1

  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 8737
    fsGroup: 8737

  # Container security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 8737
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Workflow defaults
  workflowDefaults:
    spec:
      # Default TTL for completed workflows
      ttlStrategy:
        secondsAfterCompletion: 86400   # 24 hours
        secondsAfterSuccess: 43200      # 12 hours
        secondsAfterFailure: 172800     # 48 hours

      # Pod garbage collection
      podGC:
        strategy: OnPodCompletion

  # Disable database persistence completely (use Kubernetes CRDs only)
  # Empty object = no persistence config = no database required
  persistence: {}

  # Metrics for Prometheus
  metricsConfig:
    enabled: true

# Server (UI) configuration
server:
  replicas: 1

  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 8737
    fsGroup: 8737

  # Container security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 8737
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false  # Server needs write access
    capabilities:
      drop:
        - ALL

  # Expose via ClusterIP (use port-forward or ingress)
  serviceType: ClusterIP

  # Auth mode - client for dev, sso for production
  authModes:
    - client

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Artifact repository: an S3 bucket reached with the workflow pods' IRSA
# credentials. Bucket, region and endpoint are set by Terraform
# (modules/aws-platform/helm-core.tf), which also writes the
# artifact-repositories ConfigMap the pipeline templates reference.

# No executor image override: the chart sets argoexec to its own app version
# (chart 2.0.x = v4.1.x). A hand-pinned tag drifts behind the controller.
# Explicit executor (wait/init) resources so require-resource-limits never
# depends on the argo-limits LimitRange, which ArgoCD syncs after Terraform.
# Same values as that LimitRange's defaults.
executor:
  image:
    # The chart otherwise inherits images.pullPolicy (Always) once an executor
    # block exists; the tag is immutable, so pull it once per node.
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Chart 2.x installs the full CRDs from a pre-install/pre-upgrade hook Job.
# require-resource-limits (Kyverno, Enforce) covers the argo namespace, so
# the Job needs limits or Helm's install fails at admission.
crds:
  upgradeJob:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

# RBAC configuration
createAggregateRoles: true

# Service account
workflow:
  serviceAccount:
    create: true
    name: argo-workflow

  rbac:
    create: true

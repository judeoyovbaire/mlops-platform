# Sloth PrometheusServiceLevel for pipeline success rate SLO.
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: pipeline-success-rate
  namespace: monitoring
  labels:
    app.kubernetes.io/component: slo
spec:
  service: ml-pipeline
  labels:
    team: platform
  slos:
    - name: pipeline-success
      objective: 95
      description: "95% of ML pipeline runs should complete successfully"
      # argo_workflows_total_count (Argo v4 docs/metrics.md) counts workflows
      # entering each phase; a run passes through Running before its terminal
      # phase, so the total is the terminal phases only, not every sample.
      sli:
        events:
          errorQuery: >
            sum(increase(argo_workflows_total_count{phase=~"Failed|Error"}[{{.window}}]))
          totalQuery: >
            sum(increase(argo_workflows_total_count{phase=~"Succeeded|Failed|Error"}[{{.window}}]))
      alerting:
        name: PipelineSuccessBurnRate
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "ML pipeline success rate SLO burn rate is too high"
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning

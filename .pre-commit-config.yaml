# Pre-commit hooks for MLOps Platform
# Install: uv sync && uv run pre-commit install   (pre-commit is in the dev group)
# Run manually: uv run pre-commit run --all-files
# CI runs the same (job pre-commit in ci-cd.yaml) with the tool-dependent
# hooks skipped: SKIP=terraform_validate,terraform_tflint,terraform_docs,pytest-check,no-commit-to-branch

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"] # Allow custom tags in Kubernetes YAML
        # Terraform templatefile() directives (%{ if }) are not YAML; CI strips
        # them before parsing (validate-helm).
        exclude: ^infrastructure/helm/aws/prometheus-stack-values\.yaml$
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]
        stages: [pre-commit]

  # Python linting with Ruff
  # Keep in step with ruff in uv.lock (the Lint Python job); Renovate's
  # python-linting group bumps both together.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Terraform formatting
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.4
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        args: ["--fix", "--disable", "MD013", "MD033", "MD041"]

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yaml"]

  # Secrets detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: "infrastructure/terraform/.*/terraform.tfstate.*"

  - repo: local
    hooks:
      # Kubernetes manifest validation. yannh/kubeconform ships no
      # .pre-commit-hooks.yaml (no tag does), so a remote hook can never
      # install and, worse, aborts every other hook (InvalidManifestError).
      # Needs kubeconform on PATH (brew install kubeconform); same flags and
      # skip list as the validate-kubernetes CI job, which pins 0.8.0.
      - id: kubeconform
        name: kubeconform
        entry: kubeconform
        language: system
        files: ^(components|infrastructure/kubernetes|infrastructure/argocd)/.*\.ya?ml$
        exclude: (^|/)kustomization\.ya?ml$
        args:
          - -strict
          - -summary
          - -kubernetes-version
          - "1.37.0"
          - -schema-location
          - default
          - -schema-location
          - "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          - -skip
          - AnalysisTemplate,ClusterPolicy,Rollout,EventBus,EventSource,Sensor,InferenceService,ServiceMonitor,PodMonitor,PrometheusRule

      # Run unit tests on commit
      - id: pytest-check
        name: pytest-check
        entry: uv run pytest tests/ -q --tb=short
        language: system
        pass_filenames: false
        stages: [pre-commit]
        always_run: true

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: [terraform_validate, terraform_tflint, terraform_docs, pytest-check, kubeconform]

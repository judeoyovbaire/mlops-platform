# CI/CD pipeline for the AWS EKS platform (ADR-017: single cloud)
# - Push/PR: Validates code and shows terraform plan
# - Manual: Deploy infrastructure or models

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly E2E tests on Sunday at 2:00 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      cloud:
        description: "Cloud provider"
        required: true
        default: "aws"
        type: choice
        options:
          - aws
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
      action:
        description: "Action to perform"
        required: true
        default: "validate-only"
        type: choice
        options:
          - validate-only
          - deploy-infra
          - deploy-model

env:
  PYTHON_VERSION: "3.12"
  # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.*)$
  TERRAFORM_VERSION: "1.17.1"
  # One uv for every job, and the same value as constraints.uv in
  # renovate.json: Renovate regenerates the image lockfiles with its uv and
  # the sync check below recompiles them with this one; a uv release in
  # between would make the two disagree (JDH-406). Bump both together.
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.13.8"
  # Kind and kubectl for the e2e job. Kind v0.33 defaults to a 1.37 node
  # image, matching the EKS cluster_version; kubectl stays within one minor
  # (capped below 1.38 in renovate.json until cluster_version moves).
  # renovate: datasource=github-releases depName=kubernetes-sigs/kind
  KIND_VERSION: "v0.33.0"
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  KUBECTL_VERSION: "v1.37.2"
  # Argo CLI and quick-start manifest for the Kind e2e job; keep in step with
  # the argo-workflows chart's app version (helm-versions.auto.tfvars).
  # renovate: datasource=github-releases depName=argoproj/argo-workflows
  ARGO_WORKFLOWS_VERSION: "v4.1.6"
  AWS_REGION: "eu-west-1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stage 1: Validate (runs on every push/PR - no credentials needed)
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff linter
        run: uv run ruff check pipelines/ components/ scripts/ tests/ examples/ --output-format=github

      - name: Run Ruff formatter check
        run: uv run ruff format --check pipelines/ components/ scripts/ tests/ examples/

      - name: Run mypy type check
        # pyproject configures strict settings (disallow_untyped_defs etc.);
        # enforcing them in CI keeps the config honest.
        run: uv run mypy pipelines/ components/ scripts/

      - name: Run Bandit security scan
        run: |
          pip install bandit==1.8.3
          bandit -r pipelines/ examples/ -f json -o bandit-results.json -ll

      - name: Upload Bandit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bandit-security-report
          path: bandit-results.json

  # Guard for .pre-commit-config.yaml itself: a hook repo without a
  # .pre-commit-hooks.yaml (kubeconform, until JDH-422) silently disabled
  # every local hook for months because nothing ran pre-commit in CI.
  # Tool-dependent hooks (terraform validate/tflint/docs, pytest) have their
  # own jobs and are skipped here.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup kubeconform
        uses: yokawasa/action-setup-kube-tools@f8b2f6cdd1eb8575530049beacfe5d04c0ea8944 # v0.14.1
        with:
          setup-tools: |
            kubeconform
          # renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.*)$
          kubeconform: "0.8.0"

      - name: Cache pre-commit environments
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        env:
          SKIP: terraform_validate,terraform_tflint,terraform_docs,pytest-check,no-commit-to-branch
        run: uv run pre-commit run --all-files --show-diff-on-failure --color always

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.terraform.d/plugin-cache
            infrastructure/terraform/**/.terraform
          key: terraform-${{ runner.os }}-${{ hashFiles('infrastructure/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-

      - name: Configure Terraform plugin cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infrastructure/terraform/

      # AWS Validation
      - name: Validate EKS Module
        working-directory: infrastructure/terraform/modules/eks
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate AWS Platform Module
        working-directory: infrastructure/terraform/modules/aws-platform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate AWS Bootstrap
        working-directory: infrastructure/terraform/bootstrap/aws
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate AWS Dev Environment
        working-directory: infrastructure/terraform/environments/aws/dev
        run: |
          terraform init -backend=false
          terraform validate

  validate-kubernetes:
    name: Validate Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup kubeconform
        uses: yokawasa/action-setup-kube-tools@f8b2f6cdd1eb8575530049beacfe5d04c0ea8944 # v0.14.1
        with:
          # Without setup-tools the action installs every tool it knows.
          setup-tools: |
            kubeconform
            kustomize
          # renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.*)$
          kubeconform: "0.8.0"
          # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.*)$
          kustomize: "5.8.3"

      - name: Validate Kubernetes manifests
        # -kubernetes-version tracks the EKS cluster_version (default in
        # environments/aws/dev/variables.tf and modules/eks/variables.tf) so
        # removed APIs fail here, not at apply.
        run: |
          find components infrastructure/kubernetes infrastructure/argocd \
            \( -name '*.yaml' -o -name '*.yml' \) \
            -not -name 'kustomization.yaml' | \
            xargs -I {} kubeconform -strict -summary \
              -kubernetes-version 1.37.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              --skip AnalysisTemplate,ClusterPolicy,Rollout,EventBus,EventSource,Sensor,InferenceService,ServiceMonitor,PodMonitor,PrometheusRule \
              {}

      - name: Validate Kustomize build
        run: kustomize build infrastructure/kubernetes/ > /dev/null

      - name: Validate rendered SLOs are in sync
        # slo/rendered/ is generated from the Sloth CRs by
        # scripts/render-slos.sh (ADR-016). Same drift guard as the
        # dependency lockfiles: edit a source SLO without re-rendering
        # and this fails.
        run: |
          ./scripts/render-slos.sh
          if ! git diff --exit-code -- 'infrastructure/kubernetes/slo/rendered/*.yaml'; then
            echo "::error::Rendered SLO rules out of sync with Sloth sources." \
              "Regenerate with scripts/render-slos.sh."
            exit 1
          fi
          echo "Rendered SLOs in sync"

  # Admission policies get admit+deny fixture tests: enforce-semantic-
  # versioning shipped with a substitution bug that blocked every deploy
  # and was undetectable until a real InferenceService hit the webhook
  # (docs/retros/aws-deploy-retro-2026-07.md, finding group 2).
  test-policies:
    name: Test Kyverno Policies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289 # v0.2.0
        with:
          # Matches the cluster's Kyverno (chart 3.9.x = v1.19.x). Capped
          # below 1.20 in renovate.json and grouped with the chart.
          # renovate: datasource=github-releases depName=kyverno/kyverno
          release: v1.19.2

      - name: Run policy tests
        run: |
          pip install --quiet pyyaml
          ./scripts/test-policies.sh

  validate-helm:
    name: Validate Helm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: Validate Helm values (YAML syntax)
        run: |
          for f in infrastructure/helm/{aws,common}/*.yaml; do
            echo "Checking $f..."
            # Strip Terraform %{ } template directives before YAML parsing
            sed '/%{.*}/d' "$f" | python3 -c "import sys, yaml; yaml.safe_load(sys.stdin)"
          done

      - name: Validate Helm values (yamllint)
        run: yamllint -c .yamllint.yaml infrastructure/helm/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run Trivy vulnerability scanner (IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          # Without this the action unsets the severity filter for SARIF output
          # and exit-code 1 would trip on every LOW/MEDIUM finding too.
          limit-severities-for-sarif: true
          trivyignores: ".trivyignore"
          exit-code: "1"
          skip-dirs: "**/.terraform"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}

      # Known-vulnerability audit of the three image lockfiles (hashed, so no
      # resolution needed). Enforced since 2026-11-14 (JDH-422): the #162
      # security batch cleared the last open advisories. For a known
      # advisory with no fix, add --ignore-vuln <ID> here with a comment.
      - name: Audit image dependencies (pip-audit)
        run: |
          rc=0
          for req in pipelines/training pipelines/pretrained components/kserve-transformer; do
            echo "::group::${req}"
            uvx pip-audit==2.10.1 --disable-pip --no-deps --progress-spinner off \
              -r "${req}/requirements.txt" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Scan Dockerfiles with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "components/"
          format: "table"
          severity: "HIGH,CRITICAL"
          skip-dirs: "**/.terraform"
          exit-code: "1"

  checkov-scan:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          directory: infrastructure/terraform/
          soft_fail: false
          # Pre-existing findings are recorded in the baseline; anything new fails.
          # Regenerate deliberately: checkov -d infrastructure/terraform --skip-check CKV_TF_1,CKV_TF_2 --create-baseline
          baseline: infrastructure/terraform/.checkov.baseline
          output_format: sarif
          output_file_path: checkov-results.sarif
          skip_check: CKV_TF_1,CKV_TF_2

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  scan-container-images:
    name: Scan Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build pipeline training image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./pipelines
          file: ./pipelines/training/Dockerfile
          load: true
          push: false
          tags: mlops-platform/ml-training:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Import every pipeline module inside the image's ACTUAL interpreter.
      # The dev venv runs 3.12 while the images run 3.10 (serving runtime
      # contract), so 3.11+/3.12-only code passes tests and lint yet dies at
      # runtime - a datetime.UTC import and PEP 695 generics both shipped
      # broken this way (the July py3.10 image never ran a single step).
      - name: Import-smoke the training image
        run: |
          docker run --rm mlops-platform/ml-training:test python -c "
          import importlib, pathlib
          mods = sorted(p.stem for p in pathlib.Path('/app/pipelines/training/src').glob('*.py') if p.stem != '__init__')
          for m in mods:
              importlib.import_module(f'pipelines.training.src.{m}')
          print(f'{len(mods)} pipeline modules import cleanly')"

      # Imports alone missed a broken train step: MLflow 3.17 saves sklearn
      # models with skops by default, which rejected the tree model (and
      # mlflow-skinny does not install skops). Save a real model with the
      # format train_model uses, plus a pyfunc with an input example (the
      # serving model's shape), inside the image. No tracking server needed.
      - name: Model-save smoke in the training image
        run: |
          docker run --rm mlops-platform/ml-training:test python -c "
          import tempfile, mlflow.pyfunc, mlflow.sklearn
          from sklearn.datasets import load_iris
          from sklearn.ensemble import RandomForestClassifier
          from pipelines.training.src.train_model import SKLEARN_SERIALIZATION_FORMAT
          X, y = load_iris(return_X_y=True, as_frame=True)
          model = RandomForestClassifier(n_estimators=5, random_state=0).fit(X, y)
          d = tempfile.mkdtemp()
          mlflow.sklearn.save_model(model, d + '/sk', input_example=X.head(1),
                                    serialization_format=SKLEARN_SERIALIZATION_FORMAT)
          class Wrap(mlflow.pyfunc.PythonModel):
              def __init__(self, m): self.m = m
              def predict(self, context, model_input): return self.m.predict(model_input)
          mlflow.pyfunc.save_model(d + '/py', python_model=Wrap(model), input_example=X.head(1))
          loaded = mlflow.pyfunc.load_model(d + '/py')
          print('sklearn and pyfunc models save and load:', loaded.predict(X.head(2)))"

      # The pretrained image resolves torch from the PyTorch CPU index. A
      # deploy-model dispatch neither builds nor ships this image, and two
      # July deploys were blocked for hours by PyTorch CDN TLS failures in
      # exactly this step (docs/retros/aws-deploy-retro-2026-07.md, finding
      # group 5) - so model rollouts skip the pretrained/torch stack.
      - name: Build pretrained pipeline image
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-model') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./pipelines
          file: ./pipelines/pretrained/Dockerfile
          load: true
          push: false
          tags: mlops-platform/hf-pretrained:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build kserve-transformer image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./components/kserve-transformer
          file: ./components/kserve-transformer/Dockerfile
          load: true
          push: false
          tags: mlops-platform/kserve-transformer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The unit tests stub kserve (tests/kserve_stub.py), so an SDK API break
      # (0.14 -> 0.21 removed ModelServer.parser) passes them. Start the real
      # image with the args KServe injects, behind a stub predictor, and send
      # a v1 request, a non-JSON v1 body (400) and a v2 request through a
      # preprocessor fitted in the image.
      - name: Serve-smoke the kserve-transformer image
        run: |
          set -euo pipefail
          img=mlops-platform/kserve-transformer:test
          work=$(mktemp -d)
          chmod 777 "$work"
          cleanup() { docker rm -f ksmoke-stub ksmoke-tr ksmoke-tr2 >/dev/null 2>&1 || true; docker network rm ksmoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          # The stub predictor answers v1 (dict) and v2 (InferRequest), echoing
          # what it received so the assertions below see the transformed tensor.
          cat > "$work/stub.py" <<'EOF'
          from kserve import InferOutput, InferRequest, InferResponse, Model, ModelServer
          class Stub(Model):
              def __init__(self):
                  super().__init__("iris")
                  self.ready = True
              def predict(self, payload, headers=None):
                  if isinstance(payload, InferRequest):
                      i = payload.inputs[0]
                      echo = InferOutput(name="received", shape=i.shape, datatype=i.datatype, data=i.data)
                      return InferResponse(response_id=payload.id, model_name=self.name, infer_outputs=[echo])
                  return {"predictions": [0] * len(payload["instances"]), "received": payload["instances"]}
          ModelServer(http_port=8081, enable_grpc=False).start([Stub()])
          EOF
          docker run --rm -v "$work:/w" --entrypoint python "$img" -c "
          import joblib
          from sklearn.compose import ColumnTransformer
          from sklearn.datasets import load_iris
          from sklearn.preprocessing import StandardScaler
          X = load_iris(as_frame=True).data
          ct = ColumnTransformer([('s', StandardScaler(), list(X.columns))]).fit(X)
          joblib.dump(ct, '/w/preprocessor.joblib')"
          docker network create ksmoke >/dev/null
          docker run -d --name ksmoke-stub --network ksmoke -v "$work:/w:ro" --entrypoint python "$img" /w/stub.py >/dev/null
          docker run -d --name ksmoke-tr --network ksmoke -p 18080:8080 \
            -v "$work/preprocessor.joblib:/mnt/models/preprocessor.joblib:ro" \
            "$img" --model_name iris --predictor_host ksmoke-stub:8081 --http_port 8080 >/dev/null
          for _ in $(seq 1 30); do
            curl -sf localhost:18080/v1/models/iris >/dev/null && break
            sleep 2
          done
          resp=$(curl -sf -X POST localhost:18080/v1/models/iris:predict \
            -H 'content-type: application/json' \
            -d '{"instances":[[5.1,3.5,1.4,0.2]]}') || { docker logs ksmoke-tr; docker logs ksmoke-stub; exit 1; }
          echo "$resp"
          # Scaled by the preprocessor on the way through: sepal length 5.1 -> about -0.90.
          echo "$resp" | python3 -c "import json,sys; r=json.load(sys.stdin); v=r['received'][0][0]; assert -0.95 < v < -0.85, r; print('transformer forwarded scaled features')"
          # A body without a JSON content-type reaches preprocess as bytes: 400, not 500 (JDH-425).
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:18080/v1/models/iris:predict \
            -H 'content-type: text/plain' -d '{"instances":[[5.1,3.5,1.4,0.2]]}')
          [ "$code" = "400" ] || { echo "expected 400 for a non-JSON body, got $code"; docker logs ksmoke-tr; exit 1; }
          echo "non-JSON body rejected with 400"
          # v2 in front of a v2 predictor: KServe does not inject the protocol, the
          # manifest must. Spec-style flat data with a shape, reshaped by the transformer;
          # the forwarded input must describe the transformed tensor.
          docker run -d --name ksmoke-tr2 --network ksmoke -p 18081:8080 \
            -v "$work/preprocessor.joblib:/mnt/models/preprocessor.joblib:ro" \
            "$img" --model_name iris --predictor_host ksmoke-stub:8081 --predictor_protocol v2 --http_port 8080 >/dev/null
          for _ in $(seq 1 30); do
            curl -sf localhost:18081/v2/models/iris >/dev/null && break
            sleep 2
          done
          resp=$(curl -sf -X POST localhost:18081/v2/models/iris/infer \
            -H 'content-type: application/json' \
            -d '{"inputs":[{"name":"input-0","shape":[1,4],"datatype":"FP32","data":[5.1,3.5,1.4,0.2]}]}') || { docker logs ksmoke-tr2; docker logs ksmoke-stub; exit 1; }
          echo "$resp"
          echo "$resp" | python3 -c "
          import json, sys
          r = json.load(sys.stdin)
          o = r['outputs'][0]
          assert o['shape'] == [1, 4] and o['datatype'] == 'FP32', o
          assert -0.95 < o['data'][0] < -0.85, o
          print('v2 flat request reshaped, transformed and forwarded with shape/datatype')"

      - name: Scan training pipeline image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "mlops-platform/ml-training:test"
          format: "sarif"
          output: "trivy-training-image.sarif"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"

      - name: Gate on fixable CRITICAL CVEs (training pipeline)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "mlops-platform/ml-training:test"
          format: "table"
          severity: "CRITICAL"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "1"
        # Report-only until JDH-406 refreshes the image lockfiles; then drop this.
        continue-on-error: true

      - name: Scan pretrained pipeline image
        if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-model') }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "mlops-platform/hf-pretrained:test"
          format: "sarif"
          output: "trivy-pretrained-image.sarif"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"

      - name: Gate on fixable CRITICAL CVEs (pretrained pipeline)
        if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-model') }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "mlops-platform/hf-pretrained:test"
          format: "table"
          severity: "CRITICAL"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "1"
        # Report-only until JDH-406 refreshes the image lockfiles; then drop this.
        continue-on-error: true

      - name: Scan kserve-transformer image
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "mlops-platform/kserve-transformer:test"
          format: "sarif"
          output: "trivy-transformer-image.sarif"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"

      - name: Gate on fixable CRITICAL CVEs (kserve-transformer)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "mlops-platform/kserve-transformer:test"
          format: "table"
          severity: "CRITICAL"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "1"
        # Report-only until JDH-406 refreshes the image lockfiles; then drop this.
        continue-on-error: true

      - name: Upload training image scan results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: "trivy-training-image.sarif"
          category: "trivy-training-image"

      - name: Upload pretrained image scan results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-model') }}
        with:
          sarif_file: "trivy-pretrained-image.sarif"
          category: "trivy-pretrained-image"

      - name: Upload kserve-transformer image scan results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: "trivy-transformer-image.sarif"
          category: "trivy-transformer-image"

      - name: Generate SBOM for training image
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "mlops-platform/ml-training:test"
          format: "spdx-json"
          output: "sbom-training-image.spdx.json"
          exit-code: "0"

      - name: Generate SBOM for pretrained image
        if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-model') }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "mlops-platform/hf-pretrained:test"
          format: "spdx-json"
          output: "sbom-pretrained-image.spdx.json"
          exit-code: "0"

      - name: Generate SBOM for kserve-transformer image
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "mlops-platform/kserve-transformer:test"
          format: "spdx-json"
          output: "sbom-transformer-image.spdx.json"
          exit-code: "0"

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: container-sboms
          # The pretrained SBOM is absent on deploy-model dispatches (its
          # image is skipped above); upload-artifact tolerates missing paths.
          path: |
            sbom-training-image.spdx.json
            sbom-pretrained-image.spdx.json
            sbom-transformer-image.spdx.json
          retention-days: 30
          if-no-files-found: warn

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [lint-python]
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests with coverage
        run: uv run pytest tests/ -v --tb=short --cov=pipelines --cov-report=xml --cov-report=term-missing --cov-fail-under=80 -n auto

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

      # Audits the synced dev environment (uv.lock). pip-audit is in the dev
      # group, so this runs from the lockfile; enforced since 2026-11-14
      # (JDH-422), it had been report-only and could not even start locally.
      - name: Audit Python dependencies
        run: uv run pip-audit --progress-spinner off

      - name: Validate Argo Workflow YAML
        run: |
          uv run python -c "import yaml; list(yaml.safe_load_all(open('pipelines/training/ml-training-workflow.yaml')))"
          echo "Argo Workflow YAML is valid"

  test-property:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: [lint-python]
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run property-based tests
        run: uv run pytest tests/property/ -v --tb=short

  validate-optional-deps:
    name: Validate Optional Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}

      # The component is a standalone module in components/drift-detection
      # (hyphen, not a package); tests/conftest.py puts that directory on
      # sys.path. The old `from components.drift_detection import ...` had
      # failed on every run behind continue-on-error (JDH-422).
      - name: Validate drift-detection imports
        run: |
          uv sync --frozen --extra drift-detection
          uv run python -c "
          import sys
          sys.path.insert(0, 'components/drift-detection')
          from drift_detector import DriftDetector, DriftReport
          print('Drift detector imports OK')"

      - name: Validate compiled lockfiles are in sync
        # Each image's requirements.txt is a compiled lockfile generated from
        # requirements.in (all transitive deps pinned + hashed). Recompiling
        # preserves existing pins (uv uses the output file as preferences),
        # so this fails only when .in changed without regenerating .txt.
        #
        # deploy-model dispatches skip the pretrained lockfile: recompiling
        # it fetches torch metadata from the PyTorch CDN, whose TLS flakes
        # blocked two July model rollouts that never touch that image
        # (docs/retros/aws-deploy-retro-2026-07.md, finding group 5).
        env:
          DEPLOY_MODEL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-model' }}
        run: |
          set -euo pipefail
          dirs="pipelines/training pipelines/pretrained components/kserve-transformer"
          if [ "$DEPLOY_MODEL_DISPATCH" = "true" ]; then
            dirs="pipelines/training components/kserve-transformer"
            echo "deploy-model dispatch: skipping pipelines/pretrained (torch CDN)"
          fi
          for dir in $dirs; do
            # Same argv as the lockfile header (Renovate re-runs that header
            # verbatim); the linux/amd64 target comes from [tool.uv.pip] in
            # pyproject.toml. Images differ in Python (training stays on the
            # serving runtime's 3.10; others moved on, JDH-424), so the
            # version is read from each lockfile's header line.
            pyver=$(sed -n '2s/.*--python-version=\([0-9][0-9.]*\).*/\1/p' "$dir/requirements.txt")
            if [ -z "$pyver" ]; then
              echo "::error::No --python-version in the header of $dir/requirements.txt"
              exit 1
            fi
            # The image must run the interpreter its lockfile was compiled for.
            if ! grep -q "^FROM python:${pyver}-slim" "$dir/Dockerfile"; then
              echo "::error::$dir/Dockerfile does not build on python:${pyver}-slim (lockfile header)"
              exit 1
            fi
            uv pip compile --python-version="$pyver" --generate-hashes --emit-index-url \
              --output-file="$dir/requirements.txt" "$dir/requirements.in" \
              --quiet
          done
          if ! git diff --exit-code -- '**/requirements.txt'; then
            echo "::error::Lockfile(s) out of sync with requirements.in." \
              "Regenerate with the uv pip compile command in the file header."
            exit 1
          fi
          echo "All lockfiles in sync"

  # Stage 2: Terraform Plan (requires cloud credentials)
  terraform-plan-aws:
    name: Terraform Plan (AWS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    needs:
      [
        scan-container-images,
        validate-terraform,
        validate-kubernetes,
        validate-helm,
        test-policies,
        security-scan,
        test-python,
      ]
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true
        id: aws-creds

      - name: Setup Terraform
        if: steps.aws-creds.outcome == 'success'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Cache Terraform plugins
        if: steps.aws-creds.outcome == 'success'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.terraform.d/plugin-cache
            infrastructure/terraform/**/.terraform
          key: terraform-${{ runner.os }}-${{ hashFiles('infrastructure/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-

      - name: Configure Terraform plugin cache
        if: steps.aws-creds.outcome == 'success'
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Get AWS Account ID
        if: steps.aws-creds.outcome == 'success'
        id: aws-account
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Terraform Init
        if: steps.aws-creds.outcome == 'success'
        working-directory: infrastructure/terraform/environments/aws/dev
        run: |
          # dynamodb_table and use_lockfile both hold the lock while the S3 native
          # lock is proven on a live apply; dynamodb_table goes with the table (JDH-422).
          terraform init \
            -backend-config="bucket=mlops-platform-tfstate-${{ steps.aws-account.outputs.account_id }}" \
            -backend-config="key=mlops-platform/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=mlops-platform-terraform-locks" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Check if EKS cluster exists
        if: steps.aws-creds.outcome == 'success'
        id: eks-check
        run: |
          if aws eks describe-cluster --name mlops-platform-dev --region ${{ env.AWS_REGION }} &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Plan
        if: steps.aws-creds.outcome == 'success'
        id: plan
        working-directory: infrastructure/terraform/environments/aws/dev
        run: |
          # If EKS cluster doesn't exist, only plan the EKS module to avoid K8s provider errors
          if [ "${{ steps.eks-check.outputs.exists }}" == "false" ]; then
            echo "EKS cluster not found - planning infrastructure only (module.eks)"
            terraform plan -no-color -target=module.eks -out=tfplan 2>&1 | tee plan.txt
          else
            terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
          fi

          if grep -q "No changes" plan.txt; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "## AWS Terraform Plan: No Changes" >> $GITHUB_STEP_SUMMARY
            echo "Infrastructure is up to date." >> $GITHUB_STEP_SUMMARY
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "## AWS Terraform Plan" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.eks-check.outputs.exists }}" == "false" ]; then
              echo "> **Note:** EKS cluster doesn't exist yet. Showing plan for infrastructure only." >> $GITHUB_STEP_SUMMARY
              echo "> After deploying, run again to see full plan including Kubernetes resources." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
            echo "<details><summary>Click to expand plan</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            head -500 plan.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment Plan on PR
        if: steps.aws-creds.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infrastructure/terraform/environments/aws/dev/plan.txt', 'utf8');
            const maxLength = 65000;
            const truncatedPlan = plan.length > maxLength
              ? plan.substring(0, maxLength) + '\n\n... (truncated)'
              : plan;

            const output = `## AWS Terraform Plan

            <details><summary>Show Plan</summary>

            \`\`\`
            ${truncatedPlan}
            \`\`\`

            </details>

            **To deploy**: After merging, go to Actions → CI/CD → Run workflow → Environment \`dev\` + Action \`deploy-infra\`

            *Pushed by: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Skip notice (no AWS credentials)
        if: steps.aws-creds.outcome != 'success'
        run: |
          echo "## AWS Terraform Plan: Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "AWS credentials not configured. Add \`AWS_ROLE_ARN\` secret after running bootstrap." >> $GITHUB_STEP_SUMMARY

  # Deploy Infrastructure - AWS (manual trigger only)
  deploy-infra-aws:
    name: Deploy Infrastructure (AWS)
    runs-on: ubuntu-latest
    timeout-minutes: 75  # EKS stage + Helm stage + up to 21m platform-baseline health gate
    permissions:
      contents: read
      id-token: write
    needs: [terraform-plan-aws]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.cloud == 'aws' && github.event.inputs.action == 'deploy-infra'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.terraform.d/plugin-cache
            infrastructure/terraform/**/.terraform
          key: terraform-${{ runner.os }}-${{ hashFiles('infrastructure/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-

      - name: Configure Terraform plugin cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Get AWS Account ID
        id: aws-account
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/aws/${{ github.event.inputs.environment }}
        run: |
          # dynamodb_table and use_lockfile both hold the lock while the S3 native
          # lock is proven on a live apply; dynamodb_table goes with the table (JDH-422).
          terraform init \
            -backend-config="bucket=mlops-platform-tfstate-${{ steps.aws-account.outputs.account_id }}" \
            -backend-config="key=mlops-platform/${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=mlops-platform-terraform-locks" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Backup Terraform State
        working-directory: infrastructure/terraform/environments/aws/${{ github.event.inputs.environment }}
        run: |
          terraform state pull > terraform.tfstate.backup
          echo "State backed up before apply"

      - name: Upload State Backup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: terraform-state-backup-aws-${{ github.event.inputs.environment }}-${{ github.run_id }}
          path: infrastructure/terraform/environments/aws/${{ github.event.inputs.environment }}/terraform.tfstate.backup
          retention-days: 30

      - name: Terraform Apply - Stage 1 (EKS Infrastructure)
        working-directory: infrastructure/terraform/environments/aws/${{ github.event.inputs.environment }}
        run: |
          echo "Stage 1: Deploying EKS cluster and infrastructure..."
          terraform apply -auto-approve -target=module.eks

      - name: Terraform Apply - Stage 2 (Kubernetes Resources)
        working-directory: infrastructure/terraform/environments/aws/${{ github.event.inputs.environment }}
        run: |
          echo "Stage 2: Deploying Helm releases and Kubernetes resources..."
          # Plan to a file and apply exactly that plan: applying a fresh
          # auto-approved plan would act on whatever state exists at apply
          # time rather than what was just reviewed (TOCTOU).
          terraform plan -input=false -out=tfplan
          terraform apply -input=false tfplan

      - name: Get Outputs
        working-directory: infrastructure/terraform/environments/aws/${{ github.event.inputs.environment }}
        run: |
          echo "## AWS Infrastructure Deployed (${{ github.event.inputs.environment }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          terraform output -json | jq -r 'to_entries[] | "| \(.key) | \(.value.value // "N/A") |"' >> $GITHUB_STEP_SUMMARY

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name mlops-platform-${{ github.event.inputs.environment }} --region ${{ env.AWS_REGION }}

      - name: Verify Cluster
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Cluster Status" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get nodes >> $GITHUB_STEP_SUMMARY 2>&1 || echo "Cluster provisioning..."
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Deploy Model - AWS (manual trigger only).
  # Cluster authentication happens INSIDE the reusable workflow: it runs as a
  # separate job on a fresh runner, so auth configured here would not carry
  # over (this was previously broken - the deploy job had no cluster access).
  deploy-model-aws:
    name: Deploy Model (AWS)
    needs: [terraform-plan-aws]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.cloud == 'aws' && github.event.inputs.action == 'deploy-model'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-model.yaml
    secrets: inherit  # pragma: allowlist secret
    with:
      cloud: aws
      environment: ${{ github.event.inputs.environment }}
      cluster-name: mlops-platform-${{ github.event.inputs.environment }}
      # Keep in sync with env.AWS_REGION (env context is unavailable in
      # reusable-workflow `with` blocks).
      region: eu-west-1

  # E2E Tests (nightly schedule, manual trigger, or PR label)
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [test-python]
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e-test'))
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo ./kind.sha256sum "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          echo "$(cut -d' ' -f1 kind.sha256sum)  kind" | sha256sum --check
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install Argo CLI
        run: |
          base="https://github.com/argoproj/argo-workflows/releases/download/${ARGO_WORKFLOWS_VERSION}"
          curl -fsSLO --retry 3 --retry-delay 5 "${base}/argo-linux-amd64.gz"
          curl -fsSLO --retry 3 --retry-delay 5 "${base}/argo-workflows-cli-checksums.txt"
          sha256sum --check --ignore-missing argo-workflows-cli-checksums.txt
          gunzip argo-linux-amd64.gz
          chmod +x argo-linux-amd64
          sudo mv argo-linux-amd64 /usr/local/bin/argo

      - name: Create Kind cluster
        run: |
          kind create cluster --config tests/e2e/kind-config.yaml --wait 120s

      - name: Install Argo Workflows
        run: |
          kubectl create namespace argo
          for i in 1 2 3; do
            # v4 ships full CRDs (>1 MB): client-side apply exceeds the 256 KB
            # last-applied annotation, so apply server-side.
            kubectl apply --server-side -n argo -f "https://github.com/argoproj/argo-workflows/releases/download/${ARGO_WORKFLOWS_VERSION}/quick-start-minimal.yaml" && break
            [ "$i" = 3 ] && { echo "Argo install failed after 3 attempts"; exit 1; }
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          kubectl wait --for=condition=available deployment/argo-server deployment/workflow-controller -n argo --timeout=120s

      # quick-start-minimal already runs MinIO (deployment/minio, container
      # `main`) with my-minio-cred and an artifact-repositories ConfigMap. The
      # repo's old tests/e2e/minio.yaml merged a second container into that
      # Deployment and both bound 9000/9001; the rollout never became
      # available (run 41288754780).
      - name: Lint and deploy the pipeline WorkflowTemplate
        # argo lint runs Argo's own validator (template and parameter
        # references, metric definitions); the apply then checks the template
        # against the v4 CRD schema. The argo-workflow ServiceAccount and the
        # default-artifact-repository key exist on EKS (chart, Terraform), not
        # here, so the template is validated and stored, not run.
        run: |
          argo lint --offline --kinds wftmpl pipelines/training/ml-training-workflow.yaml
          kubectl apply -k pipelines/training

      - name: Run E2E tests
        # The Argo tests fail (not skip) on a missing prerequisite. The KServe
        # test still skips: nothing installs KServe on Kind.
        env:
          E2E_CLUSTER_TEST: "true"
        run: |
          uv run pytest tests/e2e/ -v --tb=short -m e2e

      - name: Cleanup
        if: always()
        run: kind delete cluster --name mlops-e2e-test

  # Pipeline Summary
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [terraform-plan-aws]
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request')
    steps:
      - name: Summary
        run: |
          echo "## CI/CD Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deploy to Dev Environment" >> $GITHUB_STEP_SUMMARY
          echo "Actions → CI/CD → Run workflow → Environment: \`dev\` + Action: \`deploy-infra\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To destroy** (local only for safety):" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "make destroy-aws    # Destroy AWS" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

# Reusable workflow: authenticate to the target cluster, deploy model to
# KServe, and smoke test.
#
# Authentication happens INSIDE this workflow: a reusable workflow runs as a
# separate job on a fresh runner, so credentials or kubeconfig prepared in a
# caller job do not carry over. Callers pass cluster identity as inputs
# and forward secrets with `secrets: inherit`.
name: Deploy Model (Reusable)

on:
  workflow_call:
    inputs:
      cloud:
        description: "Cloud provider; only aws is supported (ADR-017)"
        required: true
        type: string
      environment:
        description: "Deployment environment (GitHub environment gate + cluster suffix)"
        required: true
        type: string
      cluster-name:
        description: "Kubernetes cluster name"
        required: true
        type: string
      region:
        description: "AWS region"
        required: false
        type: string
        default: ""
      model-name:
        description: "Registered model to deploy from the MLflow registry"
        required: false
        type: string
        default: "iris-classifier"
      model-alias:
        description: "Registry alias to resolve (the version that serves)"
        required: false
        type: string
        default: "champion"

jobs:
  deploy-and-test:
    name: Deploy & Smoke Test (${{ inputs.cloud }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC federation to the cloud provider
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # ----------------------------------------------------------------- AWS
      - name: Configure AWS credentials (OIDC)
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: Configure kubectl (EKS)
        if: inputs.cloud == 'aws'
        run: |
          aws eks update-kubeconfig \
            --name "${{ inputs.cluster-name }}" \
            --region "${{ inputs.region }}"

      - name: Verify cluster access
        run: |
          kubectl version
          kubectl get namespace mlops

      # -------------------------------------------------------------- Deploy
      # The registry is the source of truth: resolve the alias to the exact
      # artifact URI + version + run id, render the champion InferenceService,
      # and apply it. Promoting a different version in MLflow changes what the
      # next deploy serves - with full traceability in labels/annotations.
      - name: Resolve champion model from MLflow registry
        env:
          # The 2.x pin predated the MLflow 3 server (mlflow-values.yaml);
          # keep the client on the server's major, at the version the
          # training and pretrained images use (JDH-432).
          # renovate: datasource=pypi depName=mlflow-skinny
          MLFLOW_SKINNY_VERSION: "3.18.0"
        run: |
          pip install --quiet "mlflow-skinny==${MLFLOW_SKINNY_VERSION}"

          # MLflow is cluster-internal; reach it via port-forward.
          kubectl port-forward -n mlflow svc/mlflow 5000:5000 &
          PF_PID=$!
          trap "kill $PF_PID" EXIT
          for i in $(seq 1 15); do
            curl -sf http://localhost:5000/health > /dev/null && break
            sleep 2
          done

          PYTHONPATH=. python pipelines/training/src/resolve_serving_uri.py \
            --model-name "${{ inputs.model-name }}" \
            --alias "${{ inputs.model-alias }}" \
            --mlflow-uri http://localhost:5000 \
            --github-env "$GITHUB_ENV"

      - name: Deploy champion InferenceService
        run: |
          envsubst '$MODEL_NAME $MODEL_STORAGE_URI $MODEL_VERSION $MODEL_RUN_ID $MODEL_EXPERIMENT_ID' \
            < examples/kserve/champion-inferenceservice.template.yaml \
            | kubectl apply -f -

          echo "## Model Deployment (${{ inputs.cloud }} - ${{ inputs.environment }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Model | ${MODEL_NAME} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry version | ${MODEL_VERSION} (@${{ inputs.model-alias }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| MLflow run | ${MODEL_RUN_ID} |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | ${MODEL_STORAGE_URI} |" >> $GITHUB_STEP_SUMMARY

      - name: Wait for deployment
        run: |
          echo "Waiting for InferenceService to be ready..."
          kubectl wait --for=condition=Ready "inferenceservice/${MODEL_NAME}" -n mlops --timeout=300s

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## InferenceService Status" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get inferenceservice -n mlops >> $GITHUB_STEP_SUMMARY 2>&1
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Smoke test inference endpoint
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Smoke Test" >> $GITHUB_STEP_SUMMARY

          # HARD gate: a deploy that cannot serve a prediction is a failed
          # deploy, not a warning.
          PREDICTOR_SVC=$(kubectl get svc -n mlops \
            -l "serving.kserve.io/inferenceservice=${MODEL_NAME}" \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

          if [ -z "$PREDICTOR_SVC" ]; then
            echo "- **Status**: FAILED (predictor service not found)" >> $GITHUB_STEP_SUMMARY
            echo "::error::Predictor service not found"
            exit 1
          fi

          # The serving pyfunc accepts RAW features; MLServer v2 protocol with
          # the pandas codec - one named input per feature column.
          PAYLOAD='{"parameters":{"content_type":"pd"},"inputs":[
            {"name":"sepal_length","shape":[1],"datatype":"FP64","data":[5.1]},
            {"name":"sepal_width","shape":[1],"datatype":"FP64","data":[3.5]},
            {"name":"petal_length","shape":[1],"datatype":"FP64","data":[1.4]},
            {"name":"petal_width","shape":[1],"datatype":"FP64","data":[0.2]}]}'

          # `kubectl run -i --rm` attaches after the container starts; a
          # sub-second curl can exit first, and kubectl then falls back to
          # streaming logs best-effort (from a laptop: warning plus the
          # prediction; run 44939062904: empty RESPONSE). Creating the pod
          # detached and reading its logs once it has Succeeded removes the
          # race. The attempt number keeps re-runs from colliding on the name.
          SMOKE_POD="smoke-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'kubectl delete pod "$SMOKE_POD" -n mlops --ignore-not-found --wait=false' EXIT
          kubectl delete pod "$SMOKE_POD" -n mlops --ignore-not-found
          kubectl run "$SMOKE_POD" \
            --image=curlimages/curl:8.7.1 \
            --labels="app.kubernetes.io/name=smoke-test" \
            --restart=Never -n mlops \
            -- curl -sf --max-time 30 \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}" \
              "http://${PREDICTOR_SVC}/v2/models/${MODEL_NAME}/infer"
          if ! kubectl wait pod "$SMOKE_POD" -n mlops --timeout=90s \
              --for=jsonpath='{.status.phase}'=Succeeded; then
            echo "Smoke pod did not succeed:"
            kubectl get pod "$SMOKE_POD" -n mlops -o wide || true
            kubectl logs "$SMOKE_POD" -n mlops || true
            echo "- **Status**: FAILED (smoke pod did not succeed)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Smoke test failed - smoke pod did not succeed"
            exit 1
          fi
          RESPONSE=$(kubectl logs "$SMOKE_POD" -n mlops 2>/dev/null || true)
          echo "Response: ${RESPONSE}"

          if [ -n "$RESPONSE" ]; then
            echo "- **Status**: PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- **Response**: \`${RESPONSE}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: FAILED (no response from inference endpoint)" >> $GITHUB_STEP_SUMMARY
            echo "::error::Smoke test failed - no response from inference endpoint"
            exit 1
          fi

# Release Pipeline for MLOps Platform
# Triggered on version tags

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Kustomize
        uses: yokawasa/action-setup-kube-tools@f8b2f6cdd1eb8575530049beacfe5d04c0ea8944 # v0.14.1
        with:
          setup-tools: kustomize
          # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.*)$
          kustomize: "5.8.3"

      - name: Build release artifacts
        run: |
          mkdir -p release

          # Build Kustomize manifests
          kustomize build infrastructure/kubernetes/ > release/mlops-platform.yaml

          # Package Terraform modules
          tar -czvf release/terraform-eks-module.tar.gz -C infrastructure/terraform/modules eks

          # Package examples
          tar -czvf release/examples.tar.gz examples/

          # Package deploy script
          cp scripts/deploy-aws.sh release/

          # Package documentation
          tar -czvf release/docs.tar.gz docs/

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@b0db9d18b53447ef9f940a46c8f31653c4d9f621 # v6
        with:
          configuration: |
            {
              "categories": [
                {"title": "Features", "labels": ["feature", "enhancement"]},
                {"title": "Bug Fixes", "labels": ["bug", "fix"]},
                {"title": "Infrastructure", "labels": ["infrastructure", "terraform"]},
                {"title": "Documentation", "labels": ["documentation"]}
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: |
            ## MLOps Platform ${{ github.ref_name }}

            ${{ steps.changelog.outputs.changelog }}

            ### Installation

            **AWS:**
            ```bash
            ./deploy-aws.sh deploy
            # Or: cd infrastructure/terraform/environments/aws/dev && terraform init && terraform apply
            ```

            ### Components
            Chart versions: see `infrastructure/terraform/helm-versions.auto.tfvars` at this tag.

          files: |
            release/mlops-platform.yaml
            release/terraform-eks-module.tar.gz
            release/examples.tar.gz
            release/docs.tar.gz
            release/deploy-aws.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

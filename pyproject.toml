[project]
name = "mlops-platform"
version = "0.1.0"
description = "LLM inference platform on AWS EKS (classic training loop kept until vLLM benchmarks land)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Jude Oyovbaire", email = "jude@ratiolabs.dev"}
]
keywords = ["mlops", "kubernetes", "mlflow", "kserve", "vllm", "eks", "karpenter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "mlflow>=2.10.0",
    "pandera>=0.20.0",
    "transformers>=4.36.0",
    "huggingface_hub>=0.20.0",
    "shap>=0.43.0",
]

[project.optional-dependencies]
drift-detection = [
    "prometheus_client>=0.20.0",
    "scipy>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.11.0",
    "mypy>=1.8.0",
    "prometheus_client>=0.20.0",
    "scipy>=1.12.0",
    "hypothesis>=6.100.0",
]

# Image lockfiles (pipelines/*/requirements.txt, components/kserve-transformer/
# requirements.txt) are compiled for the linux/amd64 images, never for the
# machine running the compile. Kept here rather than as --python-platform in
# the lockfile header because Renovate's pip-compile manager rejects that flag
# and re-runs the header command verbatim. Applies to every `uv pip` command
# run from this repo, so `uv pip install`/`uv pip sync` here would also pick
# linux/amd64 wheels: use `uv sync` for the local venv (or pass --no-config).
# `uv sync`/`uv lock`/`uv run` ignore [tool.uv.pip].
[tool.uv.pip]
python-platform = "x86_64-unknown-linux-gnu"
# Only pipelines/pretrained has a second index (the PyTorch CPU wheels). uv's
# default first-index strategy took every package that index also hosts from
# it, at the old versions it carries: urllib3 1.26.13, requests 2.28.1,
# certifi 2022.12.7, idna 3.4, setuptools <= 78.1.0, all with open advisories.
# best-match picks the highest version across both indexes; torch stays on the
# +cpu wheel because PEP 440 ranks 2.13.0+cpu above PyPI's 2.13.0. Every name
# resolved from the PyTorch index today also exists on PyPI, so nothing can be
# shadowed; recheck if a PyTorch-only package ever enters the resolution. The
# image install needs the same strategy (pipelines/pretrained/Dockerfile).
index-strategy = "unsafe-best-match"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests requiring a Kubernetes cluster",
    "network: marks tests requiring network access",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["pipelines"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

# Pipeline images run Python 3.10 (pipelines/serving-runtime-contract.yaml).
# Without this, pyupgrade suggests 3.11+ idioms (UP017 datetime.UTC) that
# import-error at runtime in the images - which is exactly how the July
# py3.10 image shipped broken: the dev venv is 3.12, so tests passed while
# every pipeline step died on ImportError.
[tool.ruff.per-file-target-version]
"pipelines/**" = "py310"
"components/**" = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["pipelines"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true